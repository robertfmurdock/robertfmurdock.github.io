# Site Settings
encoding: "utf-8"
future: true
theme: "jekyll-theme-chirpy"
lang: "en"
timezone: "America/Detroit"

# Site Author / Owner
title: "RoB Murdock"
tagline: "Software Surgeon"
description: >-
  This is RoB's place - where curiosity meets ferocity. Rob is a software surgeon, committed to helping software help people, by getting it the care it needs. 🤖🏥🕺
url: "https://www.zegreatrob.com"
baseurl: ""
github:
  username: robertfmurdock
twitter:
  username: zegreatrob

# Author Profile
author: "RoB Murdock"
avatar: "https://www.gravatar.com/avatar/ae70b5247bf954113dd2181c75ef65fd"

social:
  name: "RoB Murdock"
  email: "rob@continuousexcellence.io"
  links:
    - "https://twitter.com/zegreatrob"
    - "https://github.com/robertfmurdock"
    - "https://linkedin.com/in/rob-murdock-0a09951"

# Analytics
analytics:
  google:
    id: "G-GZ2DSHP5CN"

# Features
toc: true
paginate: 10

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-archives
  - jekyll-sitemap
  - jekyll-include-cache

whitelist:
  - jekyll-redirect-from

# Jekyll Archives
jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/

# Collections
collections:
  tabs:
    output: true
    sort_by: order
  career_sections:
    output: true
    permalink: /career/:path/

# Include / Exclude
include: [".well-known"]
exclude: ["TeamCoaching", "team-solar-system", "vendor"]

# Front Matter Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: ""
      type: career_sections
    values:
      layout: page